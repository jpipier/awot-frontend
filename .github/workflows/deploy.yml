name: Deploy to o2switch

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # 1) Récupérer l'IP publique du runner
      - name: Get runner public IP
        id: ip
        uses: haythem/public-ip@v1.3

      # 2) Supprimer toutes les IP whitelists
      - name: Removing all whitelisted IP
        env:
          CPANEL_USERNAME: ${{ secrets.O2_USER }}
          CPANEL_API_TOKEN: ${{ secrets.O2_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
        run: |
          curl -sm 45 \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            "$CPANEL_SERVER/execute/SshWhitelist/remove_all"

      # 3) Ajouter ton IP perso + l'IP du runner
      - name: Whitelist personal + runner IP
        env:
          CPANEL_USERNAME: ${{ secrets.O2_USER }}
          CPANEL_API_TOKEN: ${{ secrets.O2_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          PERSONAL_IP: "85.122.169.101"
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
        run: |
          echo "Ajout de l'IP perso $PERSONAL_IP"
          RES1=$(curl -sm 45 \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            "$CPANEL_SERVER/execute/SshWhitelist/add?address=$PERSONAL_IP&port=22")
          echo "$RES1"

          echo "Ajout de l'IP du runner $RUNNER_IP"
          RES2=$(curl -sm 45 \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            "$CPANEL_SERVER/execute/SshWhitelist/add?address=$RUNNER_IP&port=22")
          echo "$RES2"

      # 4) SSH + deploy
      - name: Run deploy script on o2switch via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.O2_USER }}
          key: ${{ secrets.O2_SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.O2_USER }}/app/awot-frontend
            ./deploy.sh