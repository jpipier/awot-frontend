name: Deploy to o2switch

on:
  push:
    branches:
      - dev 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run deploy script on o2switch via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.O2_HOST }}
          username: ${{ secrets.O2_USER }}
          key: ${{ secrets.O2_SSH_KEY }}
          port: 22
          script: |
            cd /home/piju8755/app/awot-frontend
            ./deploy.sh