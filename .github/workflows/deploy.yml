name: Deploy to O2Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 109.234.167.10
          username: piju9724
          key: ~/.ssh/github-deploy
          port: 22
          script: |
            cd /home/piju9724/awot.theshed.fr/app/frontend/awot-frontend

            if [ ! -d .git ]; then
              git init
              git remote add origin git@github.com:jpipier/awot-frontend.git
              git fetch origin
              git checkout main
            else
              git reset --hard
              git pull origin main
            fi

            npm install --legacy-peer-deps
            npm run build
            pm2 restart awot
