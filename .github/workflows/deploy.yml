name: Deploy to o2switch

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1) Récupérer l'IP publique du runner
      - name: Get runner public IP
        id: ip
        uses: haythem/public-ip@v1.3

      # 2) Ajouter l'IP du runner dans la whitelist SSH o2switch
      - name: Whitelist runner IP on o2switch
        run: |
          curl -sm 45 \
            -H "Authorization: cpanel ${{ secrets.O2_USER }}:${{ secrets.O2_API_TOKEN }}" \
            "${{ secrets.CPANEL_HOST }}/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22"


      - name: Whitelist runner IP on o2switch
        env:
          CPANEL_USERNAME: ${{ secrets.O2_USER }}
          CPANEL_API_TOKEN: ${{ secrets.O2_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_HOST }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
        run: |
          echo "Ajout de l'IP $RUNNER_IP sur $CPANEL_SERVER…"
          RESPONSE=$(curl -sm 45 \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            "$CPANEL_SERVER/execute/SshWhitelist/add?address=$RUNNER_IP&port=22")
          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          if [ "$STATUS" != "1" ]; then
            echo "Échec de la mise en whitelist (status=$STATUS)"
            exit 1
          fi

      # 3) Lancer le script de déploiement via SSH 
      - name: Run deploy script on o2switch via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.O2_USER }}
          key: ${{ secrets.O2_SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.O2_USER }}/app/awot-frontend
            ./deploy.sh